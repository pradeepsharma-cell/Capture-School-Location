<!DOCTYPE html>
<html lang="hi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>School Location Capture</title>
<style>
  :root{
    --brand:#0f766e; --brand2:#14b8a6; --ink:#0f172a; --mute:#64748b; --bg:#f1f5f9;
    --card:#ffffff; --line:#e2e8f0; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 56px;border-radius:0 0 28px 28px}
  header h1{margin:0;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
  header p{margin:6px 0 0;font-size:13px;opacity:.9}
  .stats{display:flex;gap:10px;margin-top:14px}
  .stat{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:11px;opacity:.9}
  main{padding:0 14px 30px;margin-top:-36px;max-width:560px;margin-left:auto;margin-right:auto}
  .card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.08);margin-bottom:14px}
  label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  label:first-child{margin-top:0}
  select{width:100%;padding:14px 12px;font-size:16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%2364748b' stroke-width='2' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:40px}
  select:disabled{background-color:#f8fafc;color:#94a3b8}
  select:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(20,184,166,.2)}
  .btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:transform .08s,opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  .save{background:var(--ok);color:#fff}
  .ghost{background:#ecfeff;color:var(--brand)}
  .stack{display:grid;gap:10px;margin-top:14px}
  .hidden{display:none!important}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.ok{background:#dcfce7;color:#166534}
  .pill.no{background:#fef3c7;color:#92400e}
  .school-title{font-size:17px;font-weight:700;margin:0 0 4px}
  .school-sub{font-size:13px;color:var(--mute);margin:0 0 10px}
  .coords{background:#f8fafc;border:1px dashed var(--line);border-radius:14px;padding:12px;font-size:14px;margin-top:12px}
  .coords b{font-variant-numeric:tabular-nums}
  .acc-good{color:var(--ok)} .acc-mid{color:var(--warn)} .acc-bad{color:var(--err)}
  iframe.map{width:100%;height:210px;border:0;border-radius:14px;margin-top:12px;background:#e2e8f0}
  .msg{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:12px}
  .msg.err{background:#fee2e2;color:#991b1b}
  .msg.info{background:#e0f2fe;color:#075985}
  .msg.okm{background:#dcfce7;color:#166534}
  .spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
  .ghost .spin{border-color:rgba(15,118,110,.25);border-top-color:var(--brand)}
  @keyframes s{to{transform:rotate(360deg)}}
  .loading{text-align:center;padding:28px;color:var(--mute)}
  .manual summary{font-size:13px;color:var(--mute);cursor:pointer;margin-top:12px}
  .manual input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>📍 School Location Capture</h1>
  <p>MSMS स्कूल की लोकेशन सीधे शीट में सेव करें</p>
  <div class="stats">
    <div class="stat"><b id="stTotal">–</b><span>कुल स्कूल</span></div>
    <div class="stat"><b id="stDone">–</b><span>लोकेशन सेव</span></div>
    <div class="stat"><b id="stPend">–</b><span>बाकी</span></div>
  </div>
</header>

<main>
  <div class="card" id="loadingCard"><div class="loading">डेटा लोड हो रहा है…</div></div>

  <div class="card hidden" id="selCard">
    <label for="selDiv">Division</label>
    <select id="selDiv"><option value="">-- Select Division --</option></select>
    <label for="selPO">Project Office</label>
    <select id="selPO" disabled><option value="">-- Select Project Office --</option></select>
    <label for="selSchool">School Name</label>
    <select id="selSchool" disabled><option value="">-- Select School --</option></select>
  </div>

  <div class="card hidden" id="schoolCard">
    <p class="school-title" id="scName"></p>
    <p class="school-sub" id="scSub"></p>
    <span class="pill" id="scPill"></span>

    <div class="stack">
      <a id="openExisting" class="btn ghost hidden" target="_blank" rel="noopener" style="text-decoration:none">🧭 Google Map में Direction खोलें</a>
      <button class="btn primary" id="btnCapture">📡 Capture School Location</button>
    </div>

    <div id="capBox" class="hidden">
      <div class="coords" id="coords"></div>
      <iframe class="map" id="mapPrev" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="stack">
        <button class="btn ghost" id="btnRefresh">🔄 Refresh Google Location</button>
        <button class="btn save" id="btnSave">✅ Sheet में Save करें</button>
      </div>
    </div>

    <details class="manual">
      <summary>GPS नहीं चल रहा? Google Maps link/coordinates खुद डालें</summary>
      <input id="manualIn" placeholder="जैसे 20.0112, 73.7902 या maps link">
      <div class="stack"><button class="btn ghost" id="btnManual">इसे इस्तेमाल करें</button></div>
    </details>

    <div id="msg"></div>
  </div>
</main>

<script>
var DATA = [], cur = null, pos = null, watchId = null;
var $ = function(id){return document.getElementById(id)};

function msg(t, type){ $('msg').innerHTML = t ? '<div class="msg '+type+'">'+t+'</div>' : ''; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
function uniq(arr){ return arr.filter(function(v,i){return arr.indexOf(v)===i}); }

// Agar ye page Apps Script ke bahar host kiya ho (GitHub/Netlify/preview), to yahan apna Web App /exec URL daalein.
// Apps Script ke apne link par chalane par kuch bhi daalne ki zarurat nahi.
var WEB_APP_URL = '';

var HAS_GAS = (typeof google !== 'undefined' && google.script && google.script.run);

function api(action, params, ok, fail){
  if(HAS_GAS){
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
    if(action==='list') r.getSchools();
    else r.saveLocation(params.row, params.school, params.lat, params.lng, params.acc);
    return;
  }
  if(!WEB_APP_URL){ fail(new Error('Ye page Apps Script ke Web App link se kholein, ya Index.html me WEB_APP_URL set karein.')); return; }
  var q = Object.keys(params||{}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');
  fetch(WEB_APP_URL+'?action='+action+(q?'&'+q:''))
    .then(function(r){return r.json()})
    .then(function(j){ if(j.ok===false) fail(new Error(j.error)); else ok(action==='list'? j.data : j); })
    .catch(fail);
}

function init(){
  api('list', {}, function(d){
    DATA = d;
    $('loadingCard').classList.add('hidden');
    $('selCard').classList.remove('hidden');
    stats();
    fill($('selDiv'), uniq(DATA.map(function(x){return x.d})), '-- Select Division --');
  }, function(e){
    $('loadingCard').innerHTML = '<div class="msg err">Load nahi hua: '+esc(e.message||e)+'</div>';
  });
}
function stats(){
  var done = DATA.filter(function(x){return x.l}).length;
  $('stTotal').textContent = DATA.length; $('stDone').textContent = done; $('stPend').textContent = DATA.length-done;
}
function fill(sel, items, ph, disabled){
  sel.innerHTML = '<option value="">'+ph+'</option>' + items.map(function(v){return '<option>'+esc(v)+'</option>'}).join('');
  sel.disabled = !!disabled && !items.length;
}

$('selDiv').onchange = function(){
  var d = this.value; resetCard();
  fill($('selSchool'), [], '-- Select School --', true); $('selSchool').disabled = true;
  if(!d){ $('selPO').disabled = true; fill($('selPO'), [], '-- Select Project Office --'); $('selPO').disabled = true; return; }
  fill($('selPO'), uniq(DATA.filter(function(x){return x.d===d}).map(function(x){return x.p})), '-- Select Project Office --');
  $('selPO').disabled = false;
};
$('selPO').onchange = function(){
  var d = $('selDiv').value, p = this.value; resetCard();
  if(!p){ fill($('selSchool'), [], '-- Select School --'); $('selSchool').disabled = true; return; }
  var list = DATA.filter(function(x){return x.d===d && x.p===p});
  $('selSchool').innerHTML = '<option value="">-- Select School --</option>' + list.map(function(x){
    return '<option value="'+x.r+'">'+(x.l?'✅ ':'⬜ ')+esc(x.s)+'</option>';
  }).join('');
  $('selSchool').disabled = false;
};
$('selSchool').onchange = function(){
  resetCard();
  if(!this.value) return;
  cur = DATA.filter(function(x){return x.r==$('selSchool').value})[0];
  showSchool();
};

function resetCard(){
  stopWatch(); pos = null; cur = null; msg('');
  $('schoolCard').classList.add('hidden'); $('capBox').classList.add('hidden');
}
function showSchool(){
  $('schoolCard').classList.remove('hidden');
  $('scName').textContent = cur.s;
  $('scSub').textContent = cur.d + ' › ' + cur.p;
  var pill = $('scPill');
  if(cur.l){ pill.className='pill ok'; pill.textContent='✔ लोकेशन सेव है'; $('openExisting').href = cur.l; $('openExisting').classList.remove('hidden'); $('btnCapture').innerHTML='📡 नई Location Capture करें (Update)'; }
  else { pill.className='pill no'; pill.textContent='⚠ लोकेशन बाकी है'; $('openExisting').classList.add('hidden'); $('btnCapture').innerHTML='📡 Capture School Location'; }
  $('capBox').classList.add('hidden');
}

function stopWatch(){ if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }

function capture(btn, label){
  if(!navigator.geolocation){ msg('इस ब्राउज़र में GPS सपोर्ट नहीं है। नीचे manual option इस्तेमाल करें।','err'); return; }
  stopWatch(); msg('');
  btn.disabled = true; var old = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> लोकेशन ढूंढ रहे हैं…';
  var best = null, finished = false;
  function finish(){
    if(finished) return; finished = true; stopWatch(); clearTimeout(timer);
    btn.disabled = false; btn.innerHTML = old;
    if(best){ pos = best; render(); } else msg('लोकेशन नहीं मिली। GPS/Location ON करें और दोबारा कोशिश करें।','err');
  }
  var timer = setTimeout(finish, 12000);
  watchId = navigator.geolocation.watchPosition(function(p){
    if(!best || p.coords.accuracy < best.accuracy){
      best = {lat:p.coords.latitude, lng:p.coords.longitude, accuracy:p.coords.accuracy};
    }
    if(p.coords.accuracy <= 15) finish();
  }, function(err){
    if(finished) return;
    if(best){ finish(); return; }
    finished = true; stopWatch(); clearTimeout(timer);
    btn.disabled=false; btn.innerHTML = old;
    var m = {1:'Location की permission नहीं मिली। Browser/Phone settings में Location Allow करें।',2:'GPS signal नहीं मिला। खुली जगह पर जाएं।',3:'समय समाप्त हो गया, दोबारा कोशिश करें।'}[err.code] || 'Location error';
    msg(m,'err');
  }, {enableHighAccuracy:true, maximumAge:0, timeout:12000});
}

function render(){
  var a = Math.round(pos.accuracy||0);
  var cls = a<=20?'acc-good':(a<=50?'acc-mid':'acc-bad');
  var note = a<=20?'बहुत सटीक':(a<=50?'ठीक-ठाक':'कम सटीक — खुली जगह जाकर Refresh करें');
  $('coords').innerHTML = '📍 <b>'+pos.lat.toFixed(6)+', '+pos.lng.toFixed(6)+'</b><br>Accuracy: <b class="'+cls+'">±'+a+' m</b> ('+note+')';
  $('mapPrev').src = 'https://maps.google.com/maps?q='+pos.lat+','+pos.lng+'&z=17&output=embed';
  $('capBox').classList.remove('hidden');
  $('capBox').scrollIntoView({behavior:'smooth', block:'nearest'});
}

$('btnCapture').onclick = function(){ capture(this); };
$('btnRefresh').onclick = function(){ capture(this); };

$('btnManual').onclick = function(){
  var t = $('manualIn').value.trim();
  var m = t.match(/(-?\d{1,2}\.\d+)\s*[,\s]\s*(-?\d{1,3}\.\d+)/) || t.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);
  if(!m){ msg('Coordinates samajh nahi aaye. Format: 20.0112, 73.7902','err'); return; }
  pos = {lat:parseFloat(m[1]), lng:parseFloat(m[2]), accuracy:0}; msg(''); render();
};

$('btnSave').onclick = function(){
  if(!cur || !pos) return;
  if(cur.l && !confirm('इस स्कूल की पुरानी लोकेशन बदल दी जाएगी। जारी रखें?')) return;
  var b = this; b.disabled = true; var old = b.innerHTML; b.innerHTML = '<span class="spin"></span> सेव हो रहा है…';
  api('save', {row:cur.r, school:cur.s, lat:pos.lat, lng:pos.lng, acc:pos.accuracy}, function(r){
    b.disabled=false; b.innerHTML=old;
    cur.l = r.link; stats();
    // refresh dropdown tick marks
    var p = $('selPO').value; var keep = cur.r; $('selPO').onchange(); $('selSchool').value = keep;
    showSchool(); $('capBox').classList.add('hidden');
    msg('✅ लोकेशन शीट में सेव हो गई! अब शीट में लिंक पर क्लिक करके directly Google Map खुलेगा।','okm');
  }, function(e){
    b.disabled=false; b.innerHTML=old; msg('Save नहीं हुआ: '+esc(e.message||e),'err');
  });
};

init();
</script>
</body>
</html>
